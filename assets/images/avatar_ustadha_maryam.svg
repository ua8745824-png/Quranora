<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c13"/>
      <stop offset="50%" stop-color="#06402d"/>
      <stop offset="100%" stop-color="#03261a"/>
    </linearGradient>

    <radialGradient id="glowGrad1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#cfa84a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b88d33" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#021c13" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3c6"/>
      <stop offset="35%" stop-color="#e2bf65"/>
      <stop offset="70%" stop-color="#b88d33"/>
      <stop offset="100%" stop-color="#8a6519"/>
    </linearGradient>

    <linearGradient id="goldGradSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8e7a2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b88d33" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Hijab Drapery Gradients -->
    <linearGradient id="hijabGradMain" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#1b4d3e"/>
      <stop offset="40%" stop-color="#0d3527"/>
      <stop offset="100%" stop-color="#062218"/>
    </linearGradient>

    <linearGradient id="hijabShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#04160f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020d09" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="hijabHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6e59" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#144334" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="500" height="500" fill="url(#bgGrad1)"/>

  <!-- Radial Golden Spiritual Glow -->
  <circle cx="250" cy="220" r="230" fill="url(#glowGrad1)"/>

  <!-- Islamic Geometric Pattern Overlay in Background -->
  <g opacity="0.08" stroke="#cfa84a" stroke-width="1.2" fill="none">
    <!-- Center 8-point Star -->
    <g transform="translate(250, 210)">
      <rect x="-100" y="-100" width="200" height="200" transform="rotate(0)"/>
      <rect x="-100" y="-100" width="200" height="200" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="140"/>
      <circle cx="0" cy="0" r="180"/>
      <polygon points="0,-160 40,-60 140,-60 60,10 95,115 0,55 -95,115 -60,10 -140,-60 -40,-60"/>
      <polygon points="0,160 40,60 140,60 60,-10 95,-115 0,-55 -95,-115 -60,-10 -140,60 -40,60"/>
    </g>
  </g>

  <!-- Decorative Islamic Arch (Mihrab Frame) -->
  <path d="M 90 490 L 90 260 C 90 140 180 80 250 50 C 320 80 410 140 410 260 L 410 490" 
        fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4 2"/>
  
  <path d="M 105 490 L 105 265 C 105 155 190 98 250 70 C 310 98 395 155 395 265 L 395 490" 
        fill="none" stroke="url(#goldGrad1)" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Golden Rosette Top Finial -->
  <g transform="translate(250, 50)" filter="url(#goldGlow)">
    <circle cx="0" cy="0" r="7" fill="url(#goldGrad1)"/>
    <path d="M0 -14 L4 -5 L13 0 L4 5 L0 14 L-4 5 L-13 0 L-4 -5 Z" fill="url(#goldGrad1)"/>
  </g>

  <!-- Halo Ring behind Silhouette -->
  <circle cx="250" cy="200" r="110" fill="none" stroke="url(#goldGradSoft)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <circle cx="250" cy="200" r="118" fill="none" stroke="url(#goldGrad1)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ================= MODEST HIJAB SILHOUETTE ================= -->
  <g filter="url(#subtleShadow)">
    <!-- Back Hijab Layer (Shoulder & Torso Base) -->
    <path d="M 120 500 C 120 410 160 350 195 320 C 215 300 220 280 220 250 C 220 220 210 200 210 170 C 210 110 230 85 250 85 C 270 85 290 110 290 170 C 290 200 280 220 280 250 C 280 280 285 300 305 320 C 340 350 380 410 380 500 Z" 
          fill="url(#hijabShadow)"/>

    <!-- Main Modest Headscarf / Khimar Silhouette -->
    <!-- Head and flowing graceful chest drapery -->
    <path d="M 250 95 C 205 95 185 135 185 190 C 185 245 200 280 185 320 C 170 355 130 405 125 500 L 375 500 C 370 405 330 355 315 320 C 300 280 315 245 315 190 C 315 135 295 95 250 95 Z" 
          fill="url(#hijabGradMain)" stroke="#2d6e59" stroke-width="1"/>

    <!-- Hijab Forehead Band (Undercap Accent) -->
    <path d="M 225 150 C 235 142 265 142 275 150 C 270 156 230 156 225 150 Z" 
          fill="#cfa84a" opacity="0.6"/>

    <!-- Graceful Facial Oval Contours (Abstract / Modest Silhouette) -->
    <ellipse cx="250" cy="190" rx="36" ry="46" fill="#0b2e22" opacity="0.95"/>
    <path d="M 214 190 C 214 230 230 245 250 245 C 270 245 286 230 286 190 C 286 165 275 152 250 152 C 225 152 214 165 214 190 Z" 
          fill="#072017"/>

    <!-- Elegant Hijab Layer Folds & Highlights -->
    <!-- Left wrap drape fold -->
    <path d="M 214 185 C 205 220 200 260 215 300 C 225 325 240 350 250 390 C 240 340 220 310 210 270 C 205 240 208 205 214 185 Z" 
          fill="url(#hijabHighlight)"/>

    <!-- Right wrap drape fold crossing gracefully -->
    <path d="M 286 185 C 295 225 295 270 280 315 C 268 350 250 395 250 500 C 255 430 280 375 295 330 C 305 290 302 230 286 185 Z" 
          fill="url(#hijabHighlight)"/>

    <!-- Center Abaya / Modest Garment V-Line Accent -->
    <path d="M 250 280 L 250 495" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M 220 360 C 240 375 260 375 280 360" fill="none" stroke="url(#goldGrad1)" stroke-width="1" stroke-opacity="0.35"/>
    <path d="M 205 420 C 235 440 265 440 295 420" fill="none" stroke="url(#goldGrad1)" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- ================= GOLDEN EMBLEM (Quran & Tajweed Specialization) ================= -->
  <g transform="translate(250, 440)" filter="url(#subtleShadow)">
    <!-- Medallion Background -->
    <circle cx="0" cy="0" r="38" fill="#042418" stroke="url(#goldGrad1)" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#goldGrad1)" stroke-width="0.8" stroke-dasharray="3 2" stroke-opacity="0.7"/>

    <!-- Open Holy Quran Motif -->
    <g transform="translate(0, -3) scale(0.9)">
      <!-- Left Page -->
      <path d="M -2 -14 C -10 -15 -18 -12 -22 -6 L -22 12 C -18 7 -10 6 -2 7 Z" 
            fill="url(#goldGrad1)"/>
      <path d="M -4 -11 C -10 -12 -16 -10 -19 -5 L -19 9 C -16 5 -10 4 -4 5 Z" 
            fill="#062f20"/>
      <!-- Right Page -->
      <path d="M 2 -14 C 10 -15 18 -12 22 -6 L 22 12 C 18 7 10 6 2 7 Z" 
            fill="url(#goldGrad1)"/>
      <path d="M 4 -11 C 10 -12 16 -10 19 -5 L 19 9 C 16 5 10 4 4 5 Z" 
            fill="#062f20"/>
      <!-- Book Spine / Rehal Base -->
      <path d="M -5 8 L 0 13 L 5 8 L 9 17 L 0 14 L -9 17 Z" fill="url(#goldGrad1)"/>
      <!-- Book Lines -->
      <line x1="-16" y1="-2" x2="-7" y2="-1" stroke="#cfa84a" stroke-width="0.8" opacity="0.8"/>
      <line x1="-16" y1="2" x2="-7" y2="3" stroke="#cfa84a" stroke-width="0.8" opacity="0.8"/>
      <line x1="7" y1="-1" x2="16" y2="-2" stroke="#cfa84a" stroke-width="0.8" opacity="0.8"/>
      <line x1="7" y1="3" x2="16" y2="2" stroke="#cfa84a" stroke-width="0.8" opacity="0.8"/>
    </g>
  </g>

  <!-- Teacher Subtitle Tag Ribbon -->
  <g transform="translate(250, 488)">
    <rect x="-105" y="-10" width="210" height="18" rx="9" fill="#02170f" stroke="url(#goldGrad1)" stroke-width="1"/>
    <text x="0" y="3" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#fdf3c6" letter-spacing="1.5" text-anchor="middle">
      CERTIFIED FEMALE SCHOLAR
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="10" y="10" width="480" height="480" rx="16" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="16" y="16" width="468" height="468" rx="12" fill="none" stroke="url(#goldGrad1)" stroke-width="0.75" stroke-opacity="0.15"/>
</svg>
