<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Quranora Academy Management System</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/portal-assets/css/portal.css" />

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0b2218, #050d09 70%);
      padding: 1.5rem;
      position: relative;
    }

    .auth-bg-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(217, 119, 6, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .auth-card {
      background: rgba(16, 28, 22, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(217, 119, 6, 0.25);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), var(--shadow-gold);
      position: relative;
      z-index: 10;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      text-decoration: none;
    }

    .auth-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .demo-accounts-section {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--border-color);
    }

    .demo-accounts-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-gold);
      text-align: center;
      margin-bottom: 0.85rem;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .demo-btn {
      padding: 0.45rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition-fast);
    }

    .demo-btn:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--accent-gold);
    }

    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-bg-pattern"></div>

  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-logo" title="Back to Quranora Home">
        <div class="brand-emblem">
          <i class="fas fa-book-quran"></i>
        </div>
        <div class="brand-info" style="text-align: left;">
          <span class="brand-title">Quran<span>ora</span></span>
          <span class="brand-tag">MANAGEMENT PORTAL</span>
        </div>
      </a>
      <h1 class="auth-title">Sign In to Academy</h1>
      <p class="auth-subtitle">Role-Based Unified Portal Access</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="emailInput">Email Address</label>
        <div style="position: relative;">
          <input 
            type="email" 
            id="emailInput" 
            class="form-control" 
            placeholder="e.g. admin@quranora.com" 
            required 
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="passwordInput" style="margin-bottom: 0;">Password</label>
          <button type="button" id="togglePasswordBtn" style="background:none;border:none;color:var(--accent-gold);font-size:0.78rem;cursor:pointer;">
            <i class="fas fa-eye"></i> Show
          </button>
        </div>
        <input 
          type="password" 
          id="passwordInput" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        />
      </div>

      <button type="submit" id="submitBtn" class="btn btn-gold btn-block" style="width: 100%; margin-top: 1rem;">
        <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary);">
      New Student? <a href="/register" style="font-weight: 700; color: var(--accent-gold-light);">Register Online for Free Trial</a>
    </div>

    <!-- Quick Demo Accounts Switcher -->
    <div class="demo-accounts-section">
      <div class="demo-accounts-title">
        <i class="fas fa-bolt"></i> Instant 1-Click Role Switcher
      </div>
      <div class="demo-grid">
        <button class="demo-btn" onclick="quickLogin('superadmin')">
          <i class="fas fa-crown" style="color: var(--accent-gold);"></i> Super Admin
        </button>
        <button class="demo-btn" onclick="quickLogin('staff')">
          <i class="fas fa-user-shield" style="color: var(--info-color);"></i> Staff Admin
        </button>
        <button class="demo-btn" onclick="quickLogin('teacher-umar')">
          <i class="fas fa-chalkboard-teacher" style="color: var(--success-color);"></i> Teacher Umar
        </button>
        <button class="demo-btn" onclick="quickLogin('teacher-mueez')">
          <i class="fas fa-user-graduate" style="color: var(--success-color);"></i> Teacher Mueez
        </button>
        <button class="demo-btn" onclick="quickLogin('student-ahmed')">
          <i class="fas fa-user" style="color: #38bdf8;"></i> Student Ahmed
        </button>
        <button class="demo-btn" onclick="quickLogin('parent-fatima')">
          <i class="fas fa-users" style="color: #f472b6;"></i> Parent Fatima
        </button>
      </div>
    </div>

    <a href="/" class="back-home-link">
      <i class="fas fa-arrow-left"></i> Return to Quranora Public Website
    </a>
  </div>

  <script src="/portal-assets/js/core/api.js"></script>
  <script src="/portal-assets/js/core/ui.js"></script>
  <script src="/portal-assets/js/auth/login.js"></script>
</body>
</html>
